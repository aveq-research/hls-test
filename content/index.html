<!DOCTYPE html>
<html>
  <head>
    <title>HLS Demo</title>
  </head>
  <body>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <select id="playlist" style="width: 300px; margin-bottom: 20px">
      <optgroup label="H.264">
        <option value="/bbb/bbb.m3u8">Big Buck Bunny</option>
        <option value="/charge/charge.m3u8">CHARGE</option>
        <option value="/wing_it/wing_it.m3u8">WING IT!</option>
        <option value="/tears_of_steel/tears_of_steel.m3u8">Tears of Steel</option>
        <option value="/sparks/sparks.m3u8">Sparks (Netflix)</option>
        <option value="/meridian/meridian.m3u8">Meridian (Netflix)</option>
      </optgroup>
      <optgroup label="HEVC">
        <option value="/bbb_hevc/bbb_hevc.m3u8">Big Buck Bunny (HEVC)</option>
        <option value="/charge_hevc/charge_hevc.m3u8">CHARGE (HEVC)</option>
        <option value="/wing_it_hevc/wing_it_hevc.m3u8">WING IT! (HEVC)</option>
        <option value="/tears_of_steel_hevc/tears_of_steel_hevc.m3u8">Tears of Steel (HEVC)</option>
        <option value="/sparks_hevc/sparks_hevc.m3u8">Sparks (Netflix, HEVC)</option>
        <option value="/meridian_hevc/meridian_hevc.m3u8">Meridian (Netflix, HEVC)</option>
      </optgroup>
    </select>
    <button onclick="loadPlaylist()">Load Playlist</button>

    <video height="1080" width="1920" controls id="video"></video>

    <script>
      var video = document.getElementById("video");
      var playlistSelect = document.getElementById("playlist");

      function loadPlaylist() {
        var playlistUrl = playlistSelect.value;
        if (Hls.isSupported()) {
          const hls = new Hls({
            debug: true,
          });
          hls.loadSource(playlistUrl);
          hls.attachMedia(video);
          hls.on(Hls.Events.MANIFEST_PARSED, function () {
            video.play();
          });
        } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
          video.src = playlistUrl;
          video.addEventListener("canplay", function () {
            video.play();
          });
        }
      }
    </script>
  </body>
</html>
